; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
; change microcontroller
board_build.mcu = esp8266
; change MCU frequency
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
upload_protocol = esptool
upload_speed = 921600

framework = arduino
lib_deps = fastled/FastLED@^3.6.0
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200

; RP2040-Pico: switch NO=GP27, NC=GP26, WS2811/WS2812B data=GP28 (pins set in src/mewtur.cpp).
; Uses the community platform since the official PlatformIO one lacks this core.
[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
framework = arduino
board_build.filesystem_size = 0m
; Present as the DDAA device (pid.codes VID) so the host can find it.
board_build.arduino.earlephilhower.usb_manufacturer = EllisGL
board_build.arduino.earlephilhower.usb_product = DDAA Device
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xDDAA
lib_deps = fastled/FastLED@^3.6.0
; Evaluate #if guards so FastLED doesn't drag in BTstack, WiFi, SdFat, etc.
lib_ldf_mode = chain+
monitor_speed = 115200
